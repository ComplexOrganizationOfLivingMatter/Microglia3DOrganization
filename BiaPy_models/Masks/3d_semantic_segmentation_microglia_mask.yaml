SYSTEM:
    NUM_CPUS: 1

PROBLEM:
    TYPE: SEMANTIC_SEG
    NDIM: 3D
  
DATA: 
    PATCH_SIZE: (64, 128, 128, 1)
    CHECK_GENERATORS: False
    TRAIN:                                                                                                              
        PATH: /media/luisma/6TB/Elena/Microglia/Images/Csf1r-GFP Heterozygous/Microglia/mask/train/x_resize
        GT_PATH: /media/luisma/6TB/Elena/Microglia/Images/Csf1r-GFP Heterozygous/Microglia/mask/train/y_resize
        IN_MEMORY: True
    VAL:
        SPLIT_TRAIN: 0.2
    TEST:                                                                                                               
        PATH: /media/luisma/6TB/Elena/Microglia/Images/Csf1r-GFP Heterozygous/Microglia/normalized/resize
        GT_PATH: /media/luisma/6TB/Elena/Microglia/dataset_vessel/test/y_Reduced
        IN_MEMORY: True
        LOAD_GT: False
        PADDING: (4,4,4)

AUGMENTOR:
    ENABLE: True
    RANDOM_ROT: True
    VFLIP: True
    HFLIP: True
    ZFLIP: True
    ELASTIC: True
    CONTRAST: True
    BRIGHTNESS: True

MODEL:
    ARCHITECTURE: unet
    FEATURE_MAPS: [16, 32, 64, 128]
    DROPOUT_VALUES: [0,0,0]
    Z_DOWN: [1,1,1]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: False
    OPTIMIZER: ADAM
    LR: 1.E-4
    BATCH_SIZE: 1
    EPOCHS: 1000
    PATIENCE: 50
  
TEST:
    ENABLE: True
    AUGMENTATION: True
    STATS:
        PER_PATCH: True
        MERGE_PATCHES: True
        FULL_IMG: False
